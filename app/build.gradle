plugins { id 'com.android.application' }

android {
    namespace 'app.quietdns'
    compileSdk 35

    defaultConfig {
        applicationId 'app.quietdns'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files('libs/engine.aar')
}
